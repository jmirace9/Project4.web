<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 오늘의집</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }
        body { background-color: #fff; color: #2F3438; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }
        a { text-decoration: none; color: inherit; }

        /* 좌측 상단 로고 (캡처본 반영) */
        .header-logo { width: 100%; padding: 20px 40px; }
        .logo-area { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo-icon { width: 30px; height: 30px; background-color: #00A6EA; border-radius: 10px 10px 10px 3px; transform: rotate(-10deg); }
        .logo-text { font-size: 20px; font-weight: 800; color: #2F3438; letter-spacing: -1px; }

        /* 메인 컨테이너 */
        .signup-container { width: 100%; max-width: 400px; margin-top: 40px; }
        .page-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 30px; }

        /* SNS 간편 회원가입 */
        .sns-area { text-align: center; margin-bottom: 30px; }
        .sns-title { font-size: 12px; color: #757575; margin-bottom: 15px; }
        .sns-buttons { display: flex; justify-content: center; gap: 16px; }
        .sns-btn { width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 20px; cursor: pointer; border: none; }
        .sns-btn.facebook { background-color: #1877F2; color: white; font-family: serif; font-style: italic; }
        .sns-btn.kakao { background-color: #FEE500; color: #000; font-size: 12px; font-weight: 800; }
        .sns-btn.naver { background-color: #03C75A; color: white; }
        
        .divider { width: 100%; height: 1px; background-color: #EAEDEF; margin-bottom: 30px; }

        /* 폼 입력 영역 */
        .form-group { margin-bottom: 25px; }
        .label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
        .sub-text { font-size: 12px; color: #757575; margin-bottom: 8px; display: block; }
        
        .input-box { width: 100%; border: 1px solid #DADCE0; border-radius: 4px; padding: 12px 15px; font-size: 15px; outline: none; }
        .input-box:focus { border-color: #00A6EA; }
        .input-box::placeholder { color: #BDBDBD; }

        /* 이메일 입력 특수 레이아웃 */
        .email-wrap { display: flex; align-items: center; gap: 5px; margin-bottom: 10px; }
        .email-wrap input { flex: 1; padding: 12px; border: 1px solid #DADCE0; border-radius: 4px; outline: none; }
        .email-wrap span { color: #BDBDBD; }
        .email-wrap select { flex: 1; padding: 12px; border: 1px solid #DADCE0; border-radius: 4px; outline: none; color: #757575; background: #fff; }
        
        .btn-verify { width: 100%; padding: 14px; background-color: #F7F9FA; color: #BDBDBD; border: 1px solid #EAEDEF; border-radius: 4px; font-size: 14px; font-weight: 700; cursor: pointer; }

        /* 약관 동의 박스 */
        .terms-box { border: 1px solid #DADCE0; border-radius: 4px; padding: 0 15px; background: #fff; margin-bottom: 20px; }
        .term-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #EAEDEF; font-size: 14px; color: #2F3438; cursor: pointer; }
        .term-item:last-child { border-bottom: none; }
        .term-left { display: flex; align-items: center; gap: 10px; }
        .term-left input[type="checkbox"] { width: 18px; height: 18px; accent-color: #00A6EA; cursor: pointer; }
        .term-item.bold .term-left span { font-weight: 700; }
        .term-sub { font-size: 12px; color: #9E9E9E; font-weight: 400; margin-left: 4px; }
        .term-arrow { color: #BDBDBD; font-weight: 700; }

        /* 리캡챠 가짜 UI */
        .recaptcha-box { border: 1px solid #DADCE0; border-radius: 3px; background: #FAFAFA; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .recaptcha-left { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
        .recaptcha-checkbox { width: 24px; height: 24px; border: 2px solid #C1C1C1; border-radius: 2px; background: #fff; }
        .recaptcha-right { text-align: center; font-size: 10px; color: #9E9E9E; }
        .recaptcha-icon { font-size: 20px; margin-bottom: 2px; }

        /* 제출 버튼 */
        .btn-submit { width: 100%; padding: 16px; background-color: #00A6EA; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 20px; }
        .btn-submit:hover { background-color: #0093D1; }

        /* 하단 링크 */
        .login-link { text-align: center; font-size: 14px; color: #424242; }
        .login-link a { font-weight: 700; text-decoration: underline; margin-left: 5px; }
    </style>
</head>
<body>

    <header class="header-logo">
        <a href="/" class="logo-area">
            <div class="logo-icon"></div>
            <div class="logo-text">오늘의집</div>
        </a>
    </header>

    <main class="signup-container">
        <h1 class="page-title">회원가입</h1>

        <!-- SNS 가입 -->
        <div class="sns-area">
            <div class="sns-title">SNS계정으로 간편하게 회원가입</div>
            <div class="sns-buttons">
                <button class="sns-btn facebook" type="button">f</button>
                <button class="sns-btn kakao" type="button">TALK</button>
                <button class="sns-btn naver" type="button">N</button>
            </div>
        </div>

        <div class="divider"></div>

        <!-- 회원가입 폼 (서버 연동 시 action 입력) -->
        <form action="/api/signup" method="post">
            
            <!-- 이메일 -->
            <div class="form-group">
                <label class="label">이메일</label>
                <div class="email-wrap">
                    <input type="text" name="emailId" placeholder="이메일" required>
                    <span>@</span>
                    <select name="emailDomain" required>
                        <option value="">선택해주세요</option>
                        <option value="naver.com">naver.com</option>
                        <option value="gmail.com">gmail.com</option>
                        <option value="daum.net">daum.net</option>
                    </select>
                </div>
                <button type="button" class="btn-verify">이메일 인증하기</button>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label class="label">비밀번호</label>
                <span class="sub-text">영문, 숫자를 포함한 8자 이상의 비밀번호를 입력해주세요.</span>
                <input type="password" name="password" class="input-box" placeholder="비밀번호" required>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <label class="label">비밀번호 확인</label>
                <input type="password" name="passwordConfirm" class="input-box" placeholder="비밀번호 확인" required>
            </div>

            <!-- 닉네임 -->
            <div class="form-group">
                <label class="label">닉네임</label>
                <span class="sub-text">다른 유저와 겹치지 않도록 입력해주세요. (2~20자)</span>
                <input type="text" name="nickname" class="input-box" placeholder="별명 (2~20자)" required>
            </div>

            <!-- 약관 동의 -->
            <div class="form-group">
                <label class="label">약관동의</label>
                <div class="terms-box">
                    <label class="term-item bold">
                        <div class="term-left">
                            <input type="checkbox" id="checkAll">
                            <span>전체동의 <span class="term-sub">선택항목에 대한 동의 포함</span></span>
                        </div>
                    </label>
                    <label class="term-item">
                        <div class="term-left">
                            <input type="checkbox" name="agreeAge" required>
                            <span>만 14세 이상입니다 <span class="term-sub" style="color:#00A6EA;">(필수)</span></span>
                        </div>
                    </label>
                    <label class="term-item">
                        <div class="term-left">
                            <input type="checkbox" name="agreeTerms" required>
                            <span>이용약관 <span class="term-sub" style="color:#00A6EA;">(필수)</span></span>
                        </div>
                        <span class="term-arrow">></span>
                    </label>
                    <label class="term-item">
                        <div class="term-left">
                            <input type="checkbox" name="agreeMarketing">
                            <span>개인정보 마케팅 활용 동의 <span class="term-sub">(선택)</span></span>
                        </div>
                        <span class="term-arrow">></span>
                    </label>
                    <label class="term-item">
                        <div class="term-left">
                            <input type="checkbox" name="agreeEvent">
                            <span>이벤트, 쿠폰, 특가 알림 메일 및 SMS 등 수신 <span class="term-sub">(선택)</span></span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- 리캡챠 (디자인용 Mockup) -->
            <div class="recaptcha-box">
                <div class="recaptcha-left">
                    <div class="recaptcha-checkbox"></div>
                    <span>로봇이 아닙니다.</span>
                </div>
                <div class="recaptcha-right">
                    <div class="recaptcha-icon">♻️</div>
                    <div>reCAPTCHA</div>
                </div>
            </div>

            <button type="submit" class="btn-submit">회원가입하기</button>

        </form>

        <div class="login-link">
            이미 아이디가 있으신가요? <a href="/login">로그인</a>
        </div>
    </main>

</body>
</html>
