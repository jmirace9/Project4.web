<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 이 한 줄이 한글 깨짐 현상을 막아줍니다! -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>헤더 영역</title>
    <!-- 프리텐다드 폰트 적용 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        a { text-decoration: none; color: inherit; }
        
        .header-container { width: 1136px; margin: 0 auto; padding: 0 15px; }

        /* 1. 최상단 파란 배너 */
        .top-event-banner { background-color: #00A6EA; color: white; display: flex; justify-content: center; align-items: center; padding: 12px 0; font-size: 14px; font-weight: 700; position: relative; cursor: pointer; }
        .top-event-banner .coupon-icon { background: #fff; color: #00A6EA; padding: 2px 6px; border-radius: 2px; font-size: 10px; margin-right: 8px; font-weight: 900; }
        .top-event-banner .btn-close { position: absolute; right: 20px; font-size: 20px; font-weight: 300; cursor: pointer; }

        /* 2. 메인 헤더 (로고, 검색, 버튼) */
        .header-main-area { background: #fff; border-bottom: 1px solid #EAEDEF; }
        .header-main-area .header-container { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        
        .header-main-left { display: flex; align-items: center; gap: 35px; }
        .header-logo { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .header-logo-icon { width: 26px; height: 26px; background-color: #00A6EA; border-radius: 8px 8px 8px 2px; transform: rotate(-10deg); }
        .header-logo-text { font-size: 22px; font-weight: 900; color: #2F3438; letter-spacing: -1px; }
        
        .header-main-nav { display: flex; gap: 24px; font-size: 18px; font-weight: 700; color: #2F3438; }
        .header-main-nav a.active { color: #00A6EA; }
        .header-main-nav a:hover { color: #00A6EA; }

        .header-main-right { display: flex; align-items: center; gap: 20px; }
        .header-search { display: flex; align-items: center; background-color: #F7F9FA; border: 1px solid #DADCE0; border-radius: 4px; padding: 8px 14px; width: 280px; }
        .header-search input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; margin-left: 8px; color: #2F3438; }
        .header-search input::placeholder { color: #BDBDBD; }
        
        .header-user-nav { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; color: #424242; }
        .header-user-nav a { position: relative; padding: 0 4px; }
        .header-user-nav a:not(:last-child)::after { content: ""; position: absolute; right: -8px; top: 3px; width: 1px; height: 14px; background-color: #EAEDEF; }
        
        .header-btn-write { background-color: #00A6EA; color: white; padding: 10px 16px; border-radius: 4px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px; }

        /* 3. 서브 헤더 (하단 메뉴) */
        .header-sub-area { background: #fff; border-bottom: 1px solid #EAEDEF; }
        .header-sub-area .header-container { display: flex; justify-content: space-between; align-items: center; }
        
        .header-sub-nav { display: flex; gap: 24px; font-size: 15px; font-weight: 700; color: #424242; }
        .header-sub-nav a { padding: 12px 0; position: relative; }
        .header-sub-nav a.active { color: #00A6EA; }
        .header-sub-nav a.active::after { content: ""; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background-color: #00A6EA; }
        
        .header-trend { font-size: 13px; font-weight: 600; color: #424242; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .header-trend-rank { font-weight: 800; color: #2F3438; }
        .header-trend-new { color: #FF7777; font-size: 10px; font-weight: 800; }
    </style>
</head>
<body>

    <header>
        <!-- 최상단 배너 -->
        <div class="top-event-banner">
            <span class="coupon-icon">2만원</span>
            첫 구매라면 누구나 최대 2만원 할인! >
            <span class="btn-close">✕</span>
        </div>

        <!-- 메인 헤더 -->
        <div class="header-main-area">
            <div class="header-container">
                <div class="header-main-left">
                    <a href="/" class="header-logo">
                        <div class="header-logo-icon"></div>
                        <div class="header-logo-text">오늘의집</div>
                    </a>
                    <nav class="header-main-nav">
                        <a href="#" class="active">집구경</a>
                        <a href="#">쇼핑</a>
                        <a href="#">인테리어/생활</a>
                    </nav>
                </div>
                
                <div class="header-main-right">
                    <div class="header-search">
                        <span style="color:#9E9E9E; font-size:16px;">🔍</span>
                        <input type="text" placeholder="통합검색">
                    </div>
                    <span style="font-size:24px; cursor:pointer;">🛒</span>
                    <div class="header-user-nav">
                        <a href="#">로그인</a>
                        <a href="#">회원가입</a>
                        <a href="#">고객센터</a>
                    </div>
                    <button class="header-btn-write">글쓰기 ∨</button>
                </div>
            </div>
        </div>

        <!-- 서브 헤더 -->
        <div class="header-sub-area">
            <div class="header-container">
                <nav class="header-sub-nav">
                    <a href="#" class="active">홈</a>
                    <a href="#">추천</a>
                    <a href="#">집들이</a>
                    <a href="#">집사진</a>
                    <a href="#">커뮤니티</a>
                    <a href="#">3D인테리어</a>
                </nav>
                <div class="header-trend">
                    <span class="header-trend-rank">1</span> 
                    <span class="header-trend-new">NEW</span> 
                    템바보드수납장 
                    <span style="color:#BDBDBD;">∨</span>
                </div>
            </div>
        </div>
    </header>

</body>
</html>
