<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 오늘의집</title>
    <!-- 오늘의집 감성 프리텐다드 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }
        body { background-color: #FAFAFA; display: flex; flex-direction: column; align-items: center; min-height: 100vh; position: relative; }
        a { text-decoration: none; color: inherit; }

        /* 메인 로그인 컨테이너 */
        .login-container { width: 100%; max-width: 360px; margin-top: 120px; display: flex; flex-direction: column; align-items: center; }

        /* 로고 영역 */
        .logo-area { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 40px; cursor: pointer; }
        .logo-icon { width: 40px; height: 40px; background-color: #00A6EA; border-radius: 12px 12px 12px 4px; transform: rotate(-10deg); }
        .logo-text { font-size: 26px; font-weight: 800; color: #2F3438; letter-spacing: -1px; }

        /* 입력 폼 영역 */
        form { width: 100%; }
        
        /* 이메일, 비밀번호 합쳐진 테두리 (오늘의집 특징) */
        .input-group { width: 100%; border: 1px solid #DADCE0; border-radius: 4px; overflow: hidden; background: #fff; margin-bottom: 20px; }
        .input-group input { width: 100%; border: none; padding: 15px; font-size: 15px; outline: none; }
        .input-group input::placeholder { color: #BDBDBD; }
        .input-group input:first-child { border-bottom: 1px solid #DADCE0; }
        .input-group input:focus { background-color: #FAFAFA; } /* 포커스 시 살짝 어두워지는 디테일 */

        /* 로그인 버튼 */
        .btn-login { width: 100%; padding: 16px; background-color: #00A6EA; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-login:hover { background-color: #0093D1; }

        /* 텍스트 링크 (비밀번호 재설정 / 회원가입) */
        .sub-links { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; font-size: 13px; color: #424242; }
        .sub-links a:hover { text-decoration: underline; }

        /* SNS 간편 로그인 영역 */
        .sns-login-area { margin-top: 50px; text-align: center; width: 100%; }
        .sns-title { font-size: 12px; color: #757575; margin-bottom: 20px; }
        .sns-buttons { display: flex; justify-content: center; gap: 16px; margin-bottom: 40px; }
        
        .sns-btn { width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 20px; cursor: pointer; border: none; }
        .sns-btn.facebook { background-color: #1877F2; color: white; font-family: serif; font-style: italic; }
        .sns-btn.kakao { background-color: #FEE500; color: #000; font-size: 12px; font-weight: 800; }
        .sns-btn.naver { background-color: #03C75A; color: white; }

        /* 하단 링크 및 구분선 */
        .trouble-link { font-size: 13px; color: #9E9E9E; text-decoration: underline; margin-bottom: 25px; display: block; text-align: center; }
        .divider { width: 100%; height: 1px; background-color: #EAEDEF; margin-bottom: 25px; }
        .guest-link { font-size: 14px; color: #424242; text-align: center; display: block; cursor: pointer; }
        .guest-link:hover { text-decoration: underline; }

        /* 최하단 카피라이트 */
        .copyright { position: absolute; bottom: 40px; font-size: 10px; color: #9E9E9E; text-align: center; width: 100%; }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- 로고 -->
        <a href="/" class="logo-area">
            <div class="logo-icon"></div>
            <div class="logo-text">오늘의집</div>
        </a>

        <!-- 폼 (Spring Boot 컨트롤러 매핑용 action 설정) -->
        <form action="/api/login" method="post">
            <div class="input-group">
                <input type="email" name="email" placeholder="이메일" required>
                <input type="password" name="password" placeholder="비밀번호" required>
            </div>
            <button type="submit" class="btn-login">로그인</button>
        </form>

        <!-- 링크 -->
        <div class="sub-links">
            <a href="#">비밀번호 재설정</a>
            <a href="/signup">회원가입</a>
        </div>

        <!-- SNS 로그인 -->
        <div class="sns-login-area">
            <div class="sns-title">SNS계정으로 간편 로그인/회원가입</div>
            <div class="sns-buttons">
                <button class="sns-btn facebook">f</button>
                <button class="sns-btn kakao">TALK</button>
                <button class="sns-btn naver">N</button>
            </div>
            
            <a href="#" class="trouble-link">로그인에 문제가 있으신가요?</a>
            <div class="divider"></div>
            <a href="#" class="guest-link">비회원 주문 조회하기</a>
        </div>
    </div>

    <!-- 카피라이트 -->
    <div class="copyright">
        © bucketplace, Co., Ltd.. All Rights Reserved
    </div>

</body>
</html>
